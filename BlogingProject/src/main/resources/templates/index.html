<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog Posts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 15px;
        }
        .table th {
            letter-spacing: 0.5px;
        }
        .content-col {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
<div class="container mt-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📚 All Blog Posts</h2>
        <a href="/new" class="btn btn-success">+ New Post</a>
    </div>

    <!-- TABLE -->
    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Publish Date</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Content</th>
                    <th width="150">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="post : ${listPosts}">

                    <td th:text="${post.id}"></td>

                    <!-- ✅ CORRECT DATE DISPLAY -->
                    <td th:text="${#temporals.format(post.date,'dd MMM yyyy')}"></td>

                    <td th:text="${post.title}"></td>
                    <td th:text="${post.author}"></td>

                    <td class="content-col" th:text="${post.content}"></td>

                    <td>
                        <a th:href="@{'/editById?id=' + ${post.id}}"
                           class="btn btn-sm btn-primary">Edit</a>

                        <a th:href="@{'/delete/' + ${post.id}}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this post?')">Delete</a>
                    </td>

                </tr>
                </tbody>

            </table>
        </div>
    </div>

</div>
</body>
</html>
