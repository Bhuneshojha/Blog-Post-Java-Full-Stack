<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create New Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                 <div class="card-body">

                    <h3 class="text-center mb-4">Create New Blog Post</h3>

                    <!-- IMPORTANT -->
                    <form th:action="@{/save}" th:object="${post}" method="post">

                        <div class="mb-3">
                            <label>Title</label>
                            <input type="text" class="form-control" th:field="*{title}" required>
                        </div>

                        <div class="mb-3">
                            <label>Author</label>
                            <input type="text" class="form-control" th:field="*{author}" required>
                        </div>

                        <div class="mb-3">
                            <label>Content</label>
                            <textarea class="form-control" rows="5" th:field="*{content}" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label>Publish Date</label>
                            <input type="date" class="form-control" th:field="*{date}" required>
                        </div>


                        <div class="d-flex justify-content-between">
                            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Post</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
